<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">Selos ninja para clones e transformação</title><desc id="desc">Duas cores representam as duas mãos. Clones: indicador e médio de cada mão formam uma cruz. Transformação: dois pares de dedos juntos apontam para cima, lado a lado.</desc>
<rect width="1000" height="510" rx="22" fill="#181525"/>
<text x="36" y="47" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">SELOS NINJA · PERAVANISHCAM</text>
<rect x="25" y="72" width="460" height="344" rx="18" fill="#282138"/><rect x="515" y="72" width="460" height="344" rx="18" fill="#282138"/>
<g font-family="Arial,sans-serif" fill="#fff"><text x="53" y="112" font-size="23" font-weight="700">CLONES DAS SOMBRAS</text><text x="543" y="112" font-size="23" font-weight="700">TRANSFORMAÇÃO</text></g>
<g fill="none" stroke="#6adfd4" stroke-width="17" stroke-linecap="round"><path d="M246 304V156M269 304V156"/><path d="M714 304V156M737 304V156"/></g>
<g fill="none" stroke="#ba95ff" stroke-width="17" stroke-linecap="round"><path d="M155 218H342M155 242H342"/><path d="M778 304V156M801 304V156"/></g>
<g fill="none" stroke-width="5"><rect x="222" y="288" width="72" height="54" rx="20" stroke="#6adfd4"/><rect x="106" y="194" width="63" height="72" rx="20" stroke="#ba95ff"/><rect x="690" y="288" width="72" height="54" rx="20" stroke="#6adfd4"/><rect x="754" y="288" width="72" height="54" rx="20" stroke="#ba95ff"/></g>
<g font-family="Arial,sans-serif" fill="#e5dfee" font-size="19"><text x="62" y="380">Um par vertical + outro horizontal</text><text x="551" y="380">Dois pares juntos, apontando para cima</text><text x="36" y="456">Indicador e médio esticados; outros dedos dobrados.</text><text x="36" y="487">Segure por 0,65 s. Depois abaixe as mãos.   C: clones · T: transformar · R: voltar · H: guia</text></g>
</svg>
